<style>
  .gallery {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin: 20px 0;
  }
  .gallery img {
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
  }

  .blog-box {
    width: 500px;
    margin: 20px auto;
    padding: 15px;
    background-color: #f8f9fa;
    border-radius: 12px;
    box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
    font-family: Arial, sans-serif;
    margin-top: 20px;
  }
  .blog-box a {
    display: block;
    padding: 8px 0;
    color: #A3C1DA;
    text-decoration: none;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
  }
  .blog-box a:last-child {
    color: white;
    border-bottom: none;
  }
  .view-all {
    display: block;
    text-align: center;
    margin-top: 10px;
    padding: 8px;
    background-color: #A3C1DA;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
  }

  .view-all:hover {
    background-color: #0056b3;
  }
  .content-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
</style>
